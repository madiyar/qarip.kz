# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS (https://sveltiacms.app) — content editor at /admin.
# Editors sign in with a GitHub account that has write access to the repository.
# Saving an entry commits to `main`; Netlify then rebuilds the site (1–2 minutes).
#
# Keep the fields in sync with src/content.config.ts.

backend:
  name: github
  repo: madiyar/qarip.kz
  branch: main
  commit_messages:
    create: 'content: add {{collection}} “{{slug}}”'
    update: 'content: update {{collection}} “{{slug}}”'
    delete: 'content: delete {{collection}} “{{slug}}”'
    uploadMedia: 'content: upload “{{path}}”'
    deleteMedia: 'content: delete “{{path}}”'

app_title: Qarip — админка
site_url: https://qarip.app # keep in sync with SITE_URL in astro.config.mjs
display_url: https://qarip.app

# Images used across the site (article covers and so on).
media_folder: /public/images
public_folder: /images

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 2

editor:
  preview: false

collections:
  # ── Fonts ───────────────────────────────────────────────────────────────────
  # One folder per font: public/fonts/<slug>/font.json + the uploaded files.
  # Style names, weights, glyph counts, alphabets, WOFF2 previews and the list of
  # files in the ZIP are derived from the files when the site is built
  # (src/lib/fontLoader.ts). Download counts are real (netlify/functions/downloads.mts).
  # Deleting a font here removes its folder together with the files.
  - name: fonts
    label: Қаріптер
    label_singular: Қаріп
    description: Қаріп қосу үшін атауын жазып, файлдары мен ZIP архивін жүктеңіз. Стильдер мен салмақтар файлдан автоматты түрде оқылады.
    icon: font_download
    folder: /public/fonts
    path: '{{slug}}/font'
    extension: json
    format: json
    media_folder: ''
    public_folder: ''
    identifier_field: name
    slug: '{{name}}'
    summary: '{{name}}'
    thumbnail: false
    sortable_fields: [name, addedDate]
    view_filters:
      - { label: Біздің қаріп, field: our, pattern: true }
    fields:
      - name: name
        label: Қаріп атауы
        widget: string
        hint: 'Мысалы: Hiykaya. Сайттағы сілтеме осы атаудан жасалады.'
      - name: files
        label: Қаріп файлдары
        widget: file
        multiple: true
        min: 1
        accept: .ttf,.otf,.woff,.woff2
        choose_url: false
        hint: Барлық стильдің файлын (TTF, OTF, вариатив қаріптерді де) бірден сүйреп әкеліңіз. Стиль атауы, салмағы, глиф саны файлдан өзі оқылады.
      - name: archive
        label: ZIP архив
        widget: file
        accept: .zip
        choose_url: false
        hint: Сайттан жүктелетін архив (қаріп файлдары, лицензия, readme). Қаріп бетіндегі «Файлдар» тізімі осы архивтен алынады.
      - name: designers
        label: Дизайнерлер
        widget: relation
        collection: designers
        value_field: '{{slug}}'
        display_fields: [name]
        search_fields: [name]
        multiple: true
        min: 1
        hint: Бір немесе бірнеше дизайнер. Тізімде жоқ болса, алдымен «Дизайнерлер» бөліміне қосыңыз.
      - name: category
        label: Категория
        widget: relation
        collection: settings
        file: categories
        value_field: items.*.id
        display_fields: ['items.*.title']
        search_fields: ['items.*.name', 'items.*.title']
        dropdown_threshold: 0
      - name: license
        label: Лицензия
        widget: relation
        collection: licenses
        value_field: '{{slug}}'
        display_fields: [name]
        search_fields: [name]
        dropdown_threshold: 0
      # Options come from Анықтамалықтар → Тегтер / Мақсаты (src/data/tags.json, purposes.json).
      - name: tags
        label: Тегтер
        widget: relation
        collection: settings
        file: tags
        value_field: items.*.id
        display_fields: ['items.*.name']
        search_fields: ['items.*.name']
        multiple: true
        required: false
        dropdown_threshold: 20
        hint: «Тегін» — коммерциялық мақсатта да тегін қолдануға болатын қаріп. Жаңа тегті «Анықтамалықтар → Тегтер» бөліміне қосыңыз.
      - name: purposes
        label: Мақсаты
        widget: relation
        collection: settings
        file: purposes
        value_field: items.*.id
        display_fields: ['items.*.name']
        search_fields: ['items.*.name']
        multiple: true
        required: false
        dropdown_threshold: 20
        hint: Жаңа мақсатты «Анықтамалықтар → Мақсаты» бөліміне қосыңыз.
      - { name: our, label: Біздің қаріп, widget: boolean, default: false, required: false }
      - name: quality
        label: Сапа (1–10)
        widget: number
        value_type: float
        min: 1
        max: 10
        step: 0.5
        required: false
        hint: 1 — нашар, 10 — өте жақсы, бөлшек те болады (мысалы 7.5). Бос қалдыруға болады.
      - { name: description, label: Сипаттамасы (қазақша), widget: text, required: false }
      - { name: descriptionRu, label: Сипаттамасы (орысша), widget: text, required: false }
      - { name: descriptionEn, label: Сипаттамасы (ағылшынша), widget: text, required: false }
      - name: previewText
        label: Превью мәтіні
        widget: string
        required: false
        hint: Бос болса, стандартты панграмма көрсетіледі.
      - name: primaryStyle
        label: Негізгі стиль
        widget: string
        required: false
        hint: 'Тізімде қай стиль көрсетілетіні, мысалы: Bold немесе Narrow Bold. Бос болса — Regular.'
      - name: purchaseUrl
        label: Сатып алу сілтемесі
        widget: string
        required: false
        hint: 'Лицензия сатылатын бет не пошта, мысалы: mailto:abayemes@gmail.com'
      - name: addedDate
        label: Қосылған күні
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: '{{now}}'
      - { name: releaseDate, label: Шыққан күні, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { name: updatedDate, label: Жаңартылған күні, widget: datetime, type: date, format: YYYY-MM-DD, required: false }

  # ── Designers ───────────────────────────────────────────────────────────────
  - name: designers
    label: Дизайнерлер
    label_singular: Дизайнер
    icon: person
    folder: /src/content/designers
    extension: json
    format: json
    identifier_field: name
    slug: '{{name}}'
    summary: '{{name}}'
    media_folder: /public/images/designers
    public_folder: /images/designers
    fields:
      - { name: name, label: Аты-жөні, widget: string }
      - name: bio
        label: Өзі туралы (қазақша)
        widget: text
        hint: Міндетті. Орысша не ағылшынша мәтін бос болса, сайтта осы мәтін көрсетіледі.
      - { name: bioRu, label: Өзі туралы (орысша), widget: text, required: false }
      - { name: bioEn, label: Өзі туралы (ағылшынша), widget: text, required: false }
      - { name: photo, label: Фото, widget: image, required: false, choose_url: false }
      - name: links
        label: Сілтемелер
        widget: object
        required: false
        collapsed: false
        fields:
          - { name: website, label: Сайт, widget: string, required: false }
          - { name: telegram, label: Telegram, widget: string, required: false }
          - { name: instagram, label: Instagram, widget: string, required: false }
          - { name: behance, label: Behance, widget: string, required: false }

  # ── Journal ─────────────────────────────────────────────────────────────────
  - name: journal
    label: Журнал
    label_singular: Мақала
    icon: article
    folder: /src/content/journal
    extension: md
    format: frontmatter
    identifier_field: title
    slug:
      template: '{{title}}'
      editable: true
      hint: Сілтемедегі атау — латын әріптерімен жазған дұрыс, мысалы dash-types.
    summary: '{{title}}'
    sortable_fields: [title, pubDate]
    media_folder: /public/images/journal
    public_folder: /images/journal
    fields:
      - { name: title, label: Тақырып, widget: string }
      - { name: excerpt, label: Қысқаша сипаттама, widget: text, required: false }
      - name: pubDate
        label: Жарияланған күні
        widget: datetime
        type: date
        format: YYYY-MM-DD
        default: '{{now}}'
      - { name: author, label: Авторы, widget: string, required: false }
      - { name: authorLink, label: Автордың сілтемесі, widget: string, required: false }
      - { name: cover, label: Мұқаба суреті, widget: image, required: false, choose_url: false }
      - name: draft
        label: Жоба (сайтта көрсетпеу)
        widget: boolean
        default: false
        required: false
      - { name: body, label: Мәтін, widget: markdown }

  # ── Licenses ────────────────────────────────────────────────────────────────
  - name: licenses
    label: Лицензиялар
    label_singular: Лицензия
    icon: gavel
    folder: /src/content/licenses
    extension: md
    format: frontmatter
    identifier_field: name
    slug:
      template: '{{name}}'
      editable: true
    summary: '{{name}}'
    fields:
      - { name: name, label: Атауы, widget: string }
      - { name: description, label: Қысқаша сипаттамасы, widget: text }
      - { name: url, label: Толық мәтінге сілтеме, widget: string, required: false }
      - { name: commercial, label: Коммерциялық қолдануға болады, widget: boolean, default: false }
      - { name: modification, label: Өзгертуге болады, widget: boolean, default: false }
      - { name: distribution, label: Таратуға болады, widget: boolean, default: false }
      - { name: attribution, label: Авторды көрсету міндетті, widget: boolean, default: false, required: false }
      - name: visible
        label: Сайтта көрсету
        widget: boolean
        default: false
        required: false
        hint: Қосулы болса, лицензия «Лицензиялар» бетінде көрсетіледі. Қаріп бетінде лицензия бәрібір көрсетіледі.
      - name: prices
        label: Бағалар
        label_singular: баға
        widget: list
        required: false
        collapsed: true
        summary: '{{title}} — {{price}}'
        hint: Тек сатылатын қаріптің лицензиясына керек.
        fields:
          - { name: title, label: Атауы, widget: string }
          - { name: price, label: Бағасы, widget: string }
          - { name: href, label: Сілтеме, widget: string }
          - { name: cta, label: Батырма мәтіні, widget: string }
          - { name: highlight, label: Ерекшелеу, widget: boolean, default: false, required: false }
          - { name: features, label: Мүмкіндіктер, label_singular: мүмкіндік, widget: list, required: false }
      - { name: body, label: Толық мәтін, widget: markdown, required: false }

  # ── Reference data ──────────────────────────────────────────────────────────
  - name: settings
    label: Анықтамалықтар
    icon: settings
    files:
      - name: glossary
        label: Типографиялық сөздік
        icon: menu_book
        file: /src/content/glossary.json
        format: json
        fields:
          - name: terms
            label: Терминдер
            label_singular: термин
            widget: list
            collapsed: true
            summary: '{{term}}'
            fields:
              - { name: id, label: ID (латынша), widget: string, hint: 'Мысалы: kerning. Қайталанбауы керек.' }
              - { name: term, label: Термин, widget: string }
              - { name: en, label: Ағылшынша атауы, widget: string, required: false }
              - { name: definition, label: Анықтамасы, widget: text }
              - name: category
                label: Категория
                widget: select
                default: typography
                options:
                  - { label: Қаріптер, value: fonts }
                  - { label: Типография, value: typography }
                  - { label: Дизайн, value: design }
                  - { label: Басқа, value: other }
              - { name: example, label: Мысал, widget: string, required: false }
      - name: faq
        label: F.A.Q.
        icon: quiz
        file: /src/content/faq.json
        format: json
        fields:
          - name: items
            label: Сұрақтар
            label_singular: сұрақ
            widget: list
            collapsed: true
            summary: '{{question}}'
            hint: Сайтта осы ретпен шығады — ретін сүйреп өзгертуге болады. Орысша мен ағылшынша бос қалса, қазақшасы көрсетіледі.
            fields:
              - name: category
                label: Бөлім
                widget: select
                default: site
                options:
                  - { label: Орнату, value: install }
                  - { label: Лицензия, value: license }
                  - { label: Қаріптер, value: fonts }
                  - { label: Сайт, value: site }
              - { name: question, label: Сұрақ (қазақша), widget: string }
              - { name: answer, label: Жауап (қазақша), widget: markdown, buttons: [bold, italic, code, link, bulleted-list, numbered-list], editor_components: [] }
              - { name: questionRu, label: Сұрақ (орысша), widget: string, required: false }
              - { name: answerRu, label: Жауап (орысша), widget: markdown, required: false, buttons: [bold, italic, code, link, bulleted-list, numbered-list], editor_components: [] }
              - { name: questionEn, label: Сұрақ (ағылшынша), widget: string, required: false }
              - { name: answerEn, label: Жауап (ағылшынша), widget: markdown, required: false, buttons: [bold, italic, code, link, bulleted-list, numbered-list], editor_components: [] }
      - name: categories
        label: Қаріп категориялары
        icon: category
        file: /src/data/categories.json
        format: json
        fields:
          - name: items
            label: Категориялар
            label_singular: категория
            widget: list
            collapsed: true
            summary: '{{name}} · {{term}}'
            hint: Атауы, толық атауы мен сипаттамасы сайтта дәл осылай шығады — үш тілде де толтырыңыз.
            fields:
              - { name: id, label: ID (латынша), widget: string, pattern: ['^[a-z0-9-]+$', 'Тек кіші латын әріптері, сан және сызықша (-).'], hint: 'Сілтемеде қолданылады, мысалы sans → /fonts/category/sans/. Барын өзгертпеңіз.' }
              - { name: name, label: Атауы (қазақша), widget: string, hint: 'Батырмалар мен карточкаларда. Мысалы: Кесілген' }
              - { name: nameRu, label: Атауы (орысша), widget: string, hint: 'Мысалы: Без засечек' }
              - { name: nameEn, label: Атауы (ағылшынша), widget: string, hint: 'Мысалы: Sans serif' }
              - { name: title, label: Толық атауы (қазақша), widget: string, hint: 'Категория бетінің тақырыбы, іздеу жүйелері де осыны көреді. Мысалы: Кесілген қаріптер (sans serif)' }
              - { name: titleRu, label: Толық атауы (орысша), widget: string, hint: 'Мысалы: Шрифты без засечек (sans serif)' }
              - { name: titleEn, label: Толық атауы (ағылшынша), widget: string, hint: 'Мысалы: Sans serif fonts' }
              - { name: description, label: Сипаттамасы (қазақша), widget: text, hint: Категория бетінде тақырыптың астында. }
              - { name: descriptionRu, label: Сипаттамасы (орысша), widget: text }
              - { name: descriptionEn, label: Сипаттамасы (ағылшынша), widget: text }
              - { name: term, label: Халықаралық атауы, widget: string, hint: 'Басты беттегі түрлі-түсті жазу. Мысалы: Sans' }
              - { name: color, label: Түсі, widget: color, hint: Халықаралық атауының түсі (басты бет). }
      - name: tags
        label: Тегтер
        icon: sell
        file: /src/data/tags.json
        format: json
        fields:
          - name: items
            label: Тегтер
            label_singular: тег
            widget: list
            collapsed: true
            summary: '{{name}} · {{nameRu}} · {{nameEn}}'
            fields:
              - name: id
                label: ID (латынша)
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Тек кіші латын әріптері, сан және сызықша (-).']
                hint: 'Сілтемеде қолданылады, мысалы free → /fonts/?tag=free. Барын өзгертпеңіз — қаріптер тегке осы ID арқылы байланған. free, commercial, cyrillic, latin, variable тегтерін сайттың сүзгілері қолданады, өшірмеңіз.'
              - { name: name, label: Атауы (қазақша), widget: string }
              - { name: nameRu, label: Атауы (орысша), widget: string, required: false, hint: 'Бос қалса, қазақша атауы көрсетіледі.' }
              - { name: nameEn, label: Атауы (ағылшынша), widget: string, required: false, hint: 'Бос қалса, қазақша атауы көрсетіледі.' }
      - name: purposes
        label: Мақсаты
        icon: flag
        file: /src/data/purposes.json
        format: json
        fields:
          - name: items
            label: Мақсаттар
            label_singular: мақсат
            widget: list
            collapsed: true
            summary: '{{name}} · {{nameRu}} · {{nameEn}}'
            fields:
              - name: id
                label: ID (латынша)
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Тек кіші латын әріптері, сан және сызықша (-).']
                hint: 'Сілтемеде қолданылады, мысалы logo → /fonts/?purpose=logo. Барын өзгертпеңіз — қаріптер мақсатқа осы ID арқылы байланған.'
              - { name: name, label: Атауы (қазақша), widget: string }
              - { name: nameRu, label: Атауы (орысша), widget: string, required: false, hint: 'Бос қалса, қазақша атауы көрсетіледі.' }
              - { name: nameEn, label: Атауы (ағылшынша), widget: string, required: false, hint: 'Бос қалса, қазақша атауы көрсетіледі.' }
      - name: donators
        label: Донаторлар
        icon: volunteer_activism
        file: /src/data/donators.json
        format: json
        fields:
          - name: items
            label: Донаторлар
            label_singular: донатор
            widget: list
            required: false
            collapsed: true
            summary: '{{name}} — {{amount}} ₸'
            fields:
              - { name: name, label: Аты, widget: string }
              - { name: amount, label: Сомасы (₸), widget: number, value_type: int, default: 0 }
              - { name: message, label: Хабарлама, widget: text, required: false }
