[build]
  command = "npm run build"
  publish = "dist/"

[build.environment]
  NODE_VERSION = "22"

# Pages (HTML) keep Netlify's default caching — the browser re-checks them on every
# visit, so a font added in the CMS shows up as soon as the deploy is live.
# Do not put a long Cache-Control on /fonts/*: the catalog (/fonts/) and the font
# pages (/fonts/<slug>/) live under the same path as the font files.

# Font files are used by other sites through the hosted CSS (/fonts/<slug>.css).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Generated previews and ZIPs (src/lib/fontLoader.ts). Their URLs carry a content hash
# (?v=…), so they can be cached for good.
[[headers]]
  for = "/fonts-web/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
